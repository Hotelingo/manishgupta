# "The story": four short steps, shown on the home page and the About page.
story:
  title: "Everything I teach, I learned in the CFO's chair."
  beats:
    - when: "Shangri-La"
      title: "Learned it in the hotel"
      text: "Assistant Financial Controller in Bangkok, then task-force Resident Manager."
    - when: "CFO roles"
      title: "Used it every month"
      text: "CFO and then Group CFO across hotels, real estate and retail, with an ERP rollout across 15 hotels."
    - when: "Online"
      title: "Turned it into teaching"
      text: "19 Coursera courses, two Udemy profiles and Alison, with 392,832 enrolments so far."
    - when: "Your chair"
      title: "Taught for yours"
      text: "Books, courses and live cohorts for the finance manager heading for the CFO's chair, and the owner who needs one in it."


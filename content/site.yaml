# Work with me. status is "open" or "waitlist". Switch Advisory to "open" when ready.
offers:
  - audience: "For finance teams"
    title: "AI sessions"
    description: "Talks and workshops on using AI for analysis, forecasting and reporting, with the review controls finance work needs."
    formats: "Keynote · Half-day workshop · Team programme"
    status: "open"
    ctaLabel: "Plan a session"
    ctaUrl: "#sessions"
    waitlistNote: null
  - audience: "For finance managers"
    title: "Mentoring"
    description: "One-to-one support for finance managers moving toward CFO: commercial judgement, owner and board reporting, leadership presence."
    formats: "[FORMAT, e.g. monthly 1:1 over six months]"
    status: "open"
    ctaLabel: "Apply for mentoring"
    ctaUrl: "#notes"
    waitlistNote: null
  - audience: "For owners"
    title: "Advisory"
    description: "Selective finance advisory for hotel owners and growing businesses: reporting that owners can act on, budgets, cash and controls."

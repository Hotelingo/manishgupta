# ─────────────────────────────────────────────────────────────────────────────
# camanishgupta.com — ALL the text, figures and links on the site live here.
#
# How to edit: open this file on GitHub, click the pencil icon, change the text,
# then "Commit changes". Vercel rebuilds the site in about two minutes.
#
# Rules that keep it working:
#   • Keep the indentation (two spaces) exactly as it is.
#   • Text with a colon ( : ) or starting with [ or # must be in quotes.
#   • Lists start each item with "- ".
#   • null means "nothing here yet" (no video, no link). The site hides it.
#   • If you make a mistake, the build stops and the live site stays as it was.
#     Vercel's build log names the line to fix.
#
# Full guide: docs/EDITING.md
# ─────────────────────────────────────────────────────────────────────────────

settings:
  heroEyebrow: "CA · Group CFO · Author · Teacher"
  # The headline is: heroBefore + heroEmphasis (in gold italics) + heroAfter
  heroBefore: "Hotel finance, operations and AI, "
  heroEmphasis: "learned in the CFO's chair and taught for yours"
  heroAfter: "."
  heroIntro: >-
    From Shangri-La's finance office to Group CFO, running hotel operations
    along the way. My books, courses and cohorts teach what I use every week:
    finance, operations and AI that change decisions, not just report them.
  # Photo in public/images/. A 4:5 or 3:4 portrait works best.
  portraitUrl: "/images/manish-gupta.webp"
  # A YouTube or Vimeo link. When set, a "Watch the 60-second intro" button appears.
  introVideoUrl: null
  nowCaption: "Group CFO, CHIC, NAIA & Muzuri · hotels, real estate and retail, DRC"
  # Update this date when you recheck the figures under "reach" and "proof".
  figuresCheckedOn: "6 Oct 2026"
  aboutHeading: "Accountant by training, operator by habit."
  aboutIntro: >-
    I am a Chartered Accountant and Company Secretary with 23 years in finance:
    audit in Delhi, Shangri-La in Bangkok and Chiang Mai, then CFO roles in
    Myanmar and the DRC. Along the way I have run hotel operations as well as
    their books. I care less about finance as compliance and more about finance
    as a decision system: clear numbers, useful analysis, accountability and action.
  contactEmail: "[hello@camanishgupta.com]"
  linkedinUrl: null
  notesHeading: "One email a month from the CFO's desk to yours."
  notesText: "One finance idea, one AI workflow, one lesson from hotels, plus new cohort dates first. Hotel owners also get the free First Budget template."

